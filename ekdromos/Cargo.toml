[package]
name = "ekdromos"
description = "Ekdromos wallet library."
version = "5.0.0"
authors = ["<zingo@zingolabs.org>"]
edition = "2024"
repository = "https://github.com/auzum197/ekdromos"
homepage = "https://github.com/auzum197/ekdromos"
license = "MIT"

[features]
default = []
ci = []
testutils = [
    "portpicker",
    "tempfile",
    "pepper-sync/test-features",
    "dep:rust-embed",
    "dep:tokio-stream",
    "dep:tonic",
    "dep:zcash_proofs",
]

[dependencies]
bech32 = { workspace = true }
bip0039.workspace = true
byteorder = { workspace = true }
chrono = { workspace = true }
dirs.workspace = true
futures = { workspace = true }
hex = { workspace = true }
http.workspace = true
incrementalmerkletree = { workspace = true }
log = { workspace = true }
nonempty.workspace = true
orchard = { workspace = true }
pepper-sync = { workspace = true }
portpicker = { workspace = true, optional = true }
rand = { workspace = true }
reqwest = { workspace = true, features = ["cookies", "rustls-tls", "json"] }
ring = { workspace = true }
rust-embed = { workspace = true, features = ["debug-embed"], optional = true }
rust_decimal = { workspace = true }
rustls.workspace = true
sapling-crypto.workspace = true
secrecy = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
shardtree = { workspace = true, features = ["legacy-api"] }
tempfile = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-stream = { workspace = true, optional = true }
tonic = { workspace = true, optional = true }
tracing.workspace = true
chain-router.workspace = true
zcash_address = { workspace = true }
zcash_client_backend = { workspace = true, features = [
    "unstable",
    "unstable-serialization",
    "unstable-spanning-tree",
] }
zcash_encoding = { workspace = true }
zcash_keys = { workspace = true }
zcash_primitives = { workspace = true }
zcash_proofs = { workspace = true, features = ["download-params", "local-prover"], optional = true }
zcash_protocol = { workspace = true }
zcash_transparent = { workspace = true }
lightwallet-grpc-client = { workspace = true }
ekdromos-common = { workspace = true }
ekdromos-file-format = { workspace = true }
zip32.workspace = true
zeroize = { workspace = true }

[build-dependencies]
zcash_proofs = { workspace = true, features = ["download-params", "local-prover"] }

[dev-dependencies]
# Self dev-dependency: turns on `testutils` for the integration tests.
ekdromos = { path = ".", features = ["testutils"] }
itertools = { workspace = true }
proptest = { workspace = true }
test-log = { workspace = true }
tracing-subscriber = { workspace = true }
pepper-sync = { workspace = true, features = ["test-features"] }
portpicker = { workspace = true }
tempfile = { workspace = true }
tokio-stream = { workspace = true }
tonic = { workspace = true }

[[bench]]
name = "pepper_sync"
harness = false

[badges]
maintenance = { status = "actively-developed" }
