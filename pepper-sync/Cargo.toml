[package]
name = "pepper-sync"
description = "Pepper-sync is a crate providing a sync engine for the zcash network."
authors = ["<zingo@zingolabs.org>"]
version = "0.6.0"
edition = "2024"
repository = "https://github.com/zingolabs/zingolib"
homepage = "https://github.com/zingolabs/zingolib"
license = "MIT"

[badges]
maintenance = { status = "actively-developed" }

[features]
default = []
# removes failing calls to `GetSubTreeRoots` in darkside testing
darkside_test = []
# exposes test constructors for wallet types
test-features = ["ekdromoi-common/test-features"]

[dependencies]
# Zingo
lightwallet-protocol.workspace = true
ekdromoi-common.workspace = true
ekdromoi-netutils.workspace = true

# Zcash
incrementalmerkletree.workspace = true
orchard.workspace = true
sapling-crypto.workspace = true
shardtree.workspace = true
zcash_address.workspace = true
zcash_client_backend = { workspace = true, features = [
    "lightwalletd-tonic",
] }
zcash_keys.workspace = true
zcash_note_encryption.workspace = true
zcash_primitives.workspace = true
zcash_protocol.workspace = true
zcash_transparent.workspace = true

# Protocol
bip32.workspace = true
zip32.workspace = true

# Cryptography
jubjub.workspace = true
subtle.workspace = true

# Async
futures.workspace = true
tokio.workspace = true
tokio-util.workspace = true

# Client
tonic.workspace = true

# Logging
tracing.workspace = true

# Metrics
memuse.workspace = true

# Parallel processing
crossbeam-channel.workspace = true
rayon.workspace = true

# Error handling
thiserror.workspace = true

# Serialization
hex.workspace = true

# Documentation
simple-mermaid.workspace = true

[dev-dependencies]
ekdromoi-common = { workspace = true, features = ["test-features"] }
zcash_protocol = { workspace = true, features = [ "local-consensus"] }
criterion.workspace = true
proptest.workspace = true

[[bench]]
name = "commit"
harness = false
required-features = ["test-features"]
