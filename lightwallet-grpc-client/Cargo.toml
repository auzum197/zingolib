[package]
name = "lightwallet-grpc-client"
version = "5.0.1"
description = "network utility crate"
authors = ["zingo@zingolabs.org"]
edition = "2024"
repository = "https://github.com/zingolabs/zingo-common"
homepage = "https://github.com/zingolabs/zingo-common"
license = "MIT"

[badges]
maintenance = { status = "actively-developed" }

[dependencies]
futures.workspace = true
hex.workspace = true
hickory-resolver.workspace = true
http.workspace = true
hyper-util = { workspace = true, features = ["tokio"] }
incrementalmerkletree.workspace = true
orchard.workspace = true
sapling-crypto.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "sync"] }
wallet-api.workspace = true
zcash_primitives.workspace = true
zcash_protocol.workspace = true
tokio-rustls.workspace = true
tonic.workspace = true
tracing.workspace = true
lightwallet-protocol.workspace = true
tokio-stream = { workspace = true, optional = true }

[features]
globally-public-transparent = ["dep:tokio-stream"]
ping-very-insecure = []

[dev-dependencies]
tokio-stream.workspace = true
hyper-rustls.workspace = true
hyper-util.workspace = true
hyper.workspace = true
rustls-pemfile.workspace = true
tokio.workspace = true
http-body-util.workspace = true
x509-parser.workspace = true
