[workspace]
members = [
    "darkside-tests",
    "libtonode-tests",
    "pepper-sync",
    "zingo-cli",
    "zingo-memo",
    "zingo-price",
    "zingo-status",
    "zingolib",
    "zingolib_testutils",
]
resolver = "2"

[workspace.dependencies]
### Workspace
pepper-sync = { path = "pepper-sync" } # NOTE: for development between releases
zingo-memo = { path = "zingo-memo" } # NOTE: for development between releases
# zingo-memo = "0.1.1"
zingo-price = { path = "zingo-price" }
zingo-status = { path = "zingo-status" } # NOTE: for development between releases
# zingo-status = "0.2.1"
zingolib = { path = "zingolib" }

### Tests and Integration Tests
criterion = "0.5"
portpicker = "0.1"
proptest = "1.6.0"
tempfile = "3"
test-log = "0.2"
zcash_local_net = { git = "https://github.com/zingolabs/infrastructure.git", rev = "537f84d3d81b228c06ae82365f306ff364e164da", features = [
    "legacy-stack",
] }
zingo-consensus = { git = "https://github.com/zingolabs/infrastructure.git", rev = "537f84d3d81b228c06ae82365f306ff364e164da" }
zingo_test_vectors = { git = "https://github.com/zingolabs/infrastructure.git", rev = "537f84d3d81b228c06ae82365f306ff364e164da" }

### Documentation
indoc = "2"
simple-mermaid = "0.2.0"

### Logging
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

### Zingo-common
# The `rebuild-proto` feature regenerates the bindings from the patched crate's
# proto files (see [patch.crates-io]), which carry the Ironwood fields the
# checked-in generated code lacks. Requires `protoc`.
lightwallet-protocol = { version = "0.3.0", features = ["rebuild-proto"] }
zingo-netutils = { version = "5.0.1", features = ["globally-public-transparent"] }
zingo_common_components = "0.4.0"

### Zcash
incrementalmerkletree = "0.8.2"
orchard = "0.15.0"
sapling-crypto = "0.7.0"
shardtree = "0.7.1"
zcash_address = "0.13.0"
zcash_client_backend = { version = "0.24.0-rc.1", features = [
    "lightwalletd-tonic",
    "orchard",
    "transparent-inputs",
] }
zcash_encoding = "0.4.0"
zcash_keys = { version = "0.15.0", features = [
    "transparent-inputs",
    "sapling",
    "orchard",
] }
zcash_note_encryption = "0.4.2"
zcash_primitives = "0.29.0"
zcash_proofs = "0.29.0"
zcash_protocol = "0.10.0" # public API (TODO: remove from public API)
zcash_transparent = "0.9.0"

### Blockchain Protocol
bip0039 = { version = "0.14", features = ["rand"] }
bip32 = { version = "0.6.0-pre.1", default-features = false }
zip32 = "0.2.0"

### Cryptographic
argon2 = "0.5"
chacha20poly1305 = "0.10"
jubjub = "0.10.0"
ring = "0.17.14"
secp256k1 = "0.31.1"
secrecy = "0.8"
subtle = "2.6.1"
zeroize = "1.8"
bech32 = "0.11.0"
bs58 = "0.5"

# Parallel processing
crossbeam-channel = "0.5"
rayon = "1"

# Encoding
byteorder = "1"
hex = "0.4"
json = "0.12"
serde = "1"
serde_json = "1"

### Network
http = "1"
reqwest = { version = "0.12.15", default-features = false }
rustls = { version = "0.23.40", features = ["ring"] }
tonic = { version = "0.14", features = ["tls-webpki-roots"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
prost = "0.14"

### Async
futures = "0.3"
futures-util = "0.3"
tokio = "1"

### Error interface
thiserror = "2"

### Internal data
append-only-vec = "0.1.7"
itertools = "0.14"
nonempty = "0.11.0"
rpassword = "7"
rust_decimal = "1.37.2"
rustyline = "17.0.2"
shellwords = "1"

### OS hooks
chrono = "0.4"
clap = "4"
dirs = "6"
memuse = "0.2"
rand = "0.8"

### Misc / not-yet-grouped
rust-embed = "8"

[profile.test]
opt-level = 3

[patch.crates-io]
# Ironwood (NU6.3) proto fields (CompactTx.ironwoodActions, TreeState.ironwoodTree,
# ShieldedProtocol.ironwood, ChainMetadata.ironwoodCommitmentTreeSize). The rev is
# lightwallet-protocol-rust main after the Ironwood protos merged; the crate version
# is still 0.3.0. The generated code on that rev predates the proto change, so the
# consumer must enable its `rebuild-proto` feature (requires `protoc`).
lightwallet-protocol = { git = "https://github.com/zingolabs/lightwallet-protocol-rust", rev = "9bdfdc77eb283f2a3d26c27100cc2ac90148cd93" }
time = { git = "https://github.com/time-rs/time", tag = "v0.3.47" }
# Lazy gRPC connect so opening a wallet works offline (auzum197/zingo-common#1, merged to dev).
zingo-netutils = { git = "https://github.com/auzum197/zingo-common", branch = "dev" }

[workspace.metadata.cargo-shear]
ignored = ["tonic-prost"]
