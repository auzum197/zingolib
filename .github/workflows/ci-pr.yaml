name: CI

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".cargo/**"
      - "rust-toolchain.toml"
      - ".github/workflows/**"
  push:
    branches: [stable, dev]

jobs:
  reject-trailing-whitespace:
    uses: zingolabs/infrastructure/.github/workflows/trailing-whitespace.yaml@20485fed7a080e381130ed8120419dc81acae641

  cargo-checkmate:
    uses: ./.github/workflows/cargo-checkmate.yaml

  cargo-hack-check:
    name: Cargo Hack Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ inputs.toolchain }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install protoc
        run: |
          if ! command -v protoc; then
            sudo apt-get update
            sudo apt-get install -y protobuf-compiler
          fi

      - name: Run cargo-hack
        uses: zingolabs/infrastructure/.github/actions/cargo-hack@20485fed7a080e381130ed8120419dc81acae641
        with:
          hack-subcommand: check
          hack-flags: --workspace --exclude ekdromoi-tui --feature-powerset --lib --bins --tests --target-dir target/hack

      - name: Run cargo-hack (ekdromoi-tui)
        uses: zingolabs/infrastructure/.github/actions/cargo-hack@20485fed7a080e381130ed8120419dc81acae641
        with:
          hack-subcommand: check
          hack-flags: --package ekdromoi-tui --feature-powerset --bins --tests --target-dir target/hack

  file-format-dependencies:
    name: Wallet file crates carry no network code
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      # `cargo tree -i` exits 0 when nothing matches, so the check reads its output.
      # `rayon` is not in the list: the zakura `orchard`, `sapling-crypto` and `primitives`
      # crates enable it through their default `multicore` feature, which no crate here controls.
      - name: Check the dependency trees
        run: |
          failed=0
          for crate in ekdromoi-file-format ekdromoi-common; do
            for dep in tonic tokio hyper reqwest ekdromoi-netutils lightwallet-protocol pepper-sync; do
              if [ -n "$(cargo tree -p "$crate" -e normal -i "$dep" 2>/dev/null)" ]; then
                echo "FAIL: $crate depends on $dep"
                failed=1
              fi
            done
          done
          exit $failed

  run-doc-tests:
    name: Run doc tests
    runs-on: ubuntu-24.04
    if: github.event.pull_request.draft == false
    env:
      RUSTFLAGS: -D warnings
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install protoc
        run: |
          if ! command -v protoc; then
             sudo apt-get update
             sudo apt-get install -y protobuf-compiler
          fi

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Run doc tests
        run: cargo test --doc

  test:
    uses: ./.github/workflows/test.yaml
    with:
      nextest-flags: "-E 'not test(slow)'"
