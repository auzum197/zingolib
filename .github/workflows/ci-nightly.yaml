name: CI (Nightly)

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *'

jobs:

  pr-checks:
    uses: ./.github/workflows/ci-pr.yaml

  cargo-hack-build:
    name: Cargo Hack Build
    runs-on: ubuntu-24.04
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ inputs.toolchain }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install protoc
        run: |
          if ! command -v protoc; then
            sudo apt-get update
            sudo apt-get install -y protobuf-compiler
          fi

      - name: Run cargo-hack
        uses: ./.github/actions/cargo-hack
        with:
          hack-subcommand: build
          hack-flags: --workspace --exclude watchonly-tui --feature-powerset --lib --bins --tests --target-dir target/hack

      - name: Run cargo-hack (watchonly-tui)
        uses: ./.github/actions/cargo-hack
        with:
          hack-subcommand: build
          hack-flags: --package watchonly-tui --feature-powerset --bins --tests --target-dir target/hack

  test:
    uses: ./.github/workflows/test.yaml
