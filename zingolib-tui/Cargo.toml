[package]
name = "zingolib-tui"
description = "Watch-only terminal wallet for Zcash, built on zingolib."
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "zingolib-tui"
path = "src/main.rs"

[dependencies]
zingolib = { workspace = true }
pepper-sync = { workspace = true }
zingolib-common = { workspace = true }
zingo_common_components = { workspace = true }
zip32 = { workspace = true }
zcash_protocol = { workspace = true }

ratatui = { workspace = true }
crossterm = { workspace = true }
qrcode = { workspace = true }

clap = { workspace = true, features = ["derive"] }
chrono = { workspace = true }
dirs = { workspace = true }
http = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
zingolib = { workspace = true, features = ["testutils"] }
zingo_test_vectors = { workspace = true }
zcash_keys = { workspace = true }
tempfile = { workspace = true }
